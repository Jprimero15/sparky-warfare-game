name: Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi

          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify Android-only project
        shell: bash
        run: |
          set -euxo pipefail
          test -f settings.gradle.kts
          test -f android/build.gradle.kts
          test ! -e desktop
          grep -q 'include("core", "android")' settings.gradle.kts
          ! grep -RniE 'lwjgl|DesktopLauncher|include\\([^)]*desktop|project\\(\":desktop\"\\)' \
            build.gradle.kts settings.gradle.kts core android

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --version
          gradle :android:clean :android:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find android/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ls -lh "$APK"
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -Z1 "$APK" | grep -Fx "lib/$ABI/libgdx.so"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sparky-warfare-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
